app-id: io.github.recursive_ai_dev.BeastAndCrimson
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: beast-and-crimson
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: beast-and-crimson
    buildsystem: simple
    build-commands:
      - install -d /app/main/electron /app/share/beast-and-crimson
      - cp -a electron-bin/* /app/main/electron/
      - cp -a index.html style.css src assets electron package.json LICENSE /app/share/beast-and-crimson/
      - install -Dm644 flatpak/io.github.recursive_ai_dev.BeastAndCrimson.desktop /app/share/applications/io.github.recursive_ai_dev.BeastAndCrimson.desktop
      - install -Dm644 flatpak/io.github.recursive_ai_dev.BeastAndCrimson.metainfo.xml /app/share/metainfo/io.github.recursive_ai_dev.BeastAndCrimson.metainfo.xml
      - install -Dm644 flatpak/io.github.recursive_ai_dev.BeastAndCrimson.png /app/share/icons/hicolor/256x256/apps/io.github.recursive_ai_dev.BeastAndCrimson.png
      - |
        install -Dm755 /dev/stdin /app/bin/beast-and-crimson <<'EOF'
        #!/bin/sh
        exec zypak-wrapper /app/main/electron/electron /app/share/beast-and-crimson/electron/main.js "$@"
        EOF
    sources:
      - type: git
        url: https://github.com/recursive-ai-dev/beast-and-crimson.git
        tag: v0.10.4
      - type: archive
        url: https://github.com/electron/electron/releases/download/v45.5.0/electron-v45.5.0-linux-x64.zip
        sha256: 36b44cd0c3d355ee74557bea2353e4539f96e1a09733a52a052bd093134a6142
        dest: electron-bin
        strip-components: 0
